version: "3"

silent: true

vars:
  ACTIVE_TOOLS:
    map:
      aerospace:
        github: https://github.com/nikitabobko/AeroSpace
        version: aerospace --version
      fish:
        website: https://fishshell.com/
        github: https://github.com/fish-shell/fish-shell
        version: fish --version
        files:
          - .config/fish/config.fish
          - .config/fish/fish_variables
          - .config/fish/functions/fetch-upstream.fish
          - .config/fish/functions/fish_greeting.fish
          - .config/fish/functions/set-upstream.fish
      ghostty:
        website: https://ghostty.org/
        github: https://github.com/ghostty-org/ghostty
        version: ghostty --version
      jrnl:
        website: https://jrnl.sh/
        github: https://github.com/jrnl-org/jrnl
        version: jrnl --version
        files:
          - .config/jrnl/jrnl.yaml
      kitty:
        website: https://sw.kovidgoyal.net/kitty/
        github: https://github.com/kovidgoyal/kitty
        version: kitty --version
        files:
          - .config/kitty/kitty.conf
      neofetch:
        github: https://github.com/dylanaraps/neofetch
        version: neofetch --version
        files:
          - .config/neofetch/config.conf
      nvim:
        website: https://neovim.io/
        github: https://github.com/neovim/neovim
        version: nvim --version
        files:
          - .config/nvim/init.lua
          - .config/nvim/lazy-lock.json
          - .config/nvim/lazyvim.json
          - .config/nvim/lua/config/autocmds.lua
          - .config/nvim/lua/config/keymaps.lua
          - .config/nvim/lua/config/lazy.lua
          - .config/nvim/lua/config/options.lua
          - .config/nvim/lua/plugins/default.lua
          - .config/nvim/stylua.toml
      starship:
        website: https://starship.rs/
        github: https://github.com/starship/starship
        version: starship --version
        files:
          - .config/starship.toml
      tig:
        website: https://jonas.github.io/tig/
        github: https://github.com/jonas/tig
        version: tig --version
        files:
          - .config/tig/config
      git:
        website: https://git-scm.com/
        github: https://github.com/git/git
        version: git --version
        files:
          - .gitconfig
      tmux:
        github: https://github.com/tmux/tmux
        version: tmux -V
        files:
          - .config/tmux/tmux.conf
  INACTIVE_TOOLS:
    map:
      alacritty:
        website: https://alacritty.org/
        github: https://github.com/alacritty/alacritty
      doom:
        website: https://doomemacs.org/
        github: https://github.com/doomemacs/core
      finicky:
        website: https://johnste.github.io/finicky/
        github: https://github.com/johnste/finicky
      skhd:
        github: https://github.com/asmvik/skhd
      vim:
        website: https://www.vim.org/
        github: https://github.com/vim/vim
      yabai:
        github: https://github.com/asmvik/yabai

tasks:
  default:
    cmds:
      - task --list

  compare:
    desc: Compare configuration files in VS Code
    summary: |
      用 VS Code 对比 active 配置，左侧为仓库文件，右侧为 home 下相同路径的文件。
      本机文件缺失时，提示并打开仓库文件。
    preconditions:
      - sh: command -v code >/dev/null 2>&1
        msg: 请将 VS Code 的 code 命令加入 PATH。
    cmds:
      - for: {var: ACTIVE_TOOLS}
        cmd: |
          {{range .ITEM.files}}
          local_file="$HOME/{{.}}"
          if [ -f "$local_file" ]; then
            code --diff "{{.}}" "$local_file"
          else
            printf '∅ 本地不存在：%s\n' "$local_file"
            code "{{.}}"
          fi
          {{end}}

  versions:
    desc: Record versions of active tools
    summary: |
      将 active 工具的版本写入 version.csv，未获取到版本时标记为 ∅。
    cmds:
      - |
        snapshot=$(mktemp version.csv.XXXXXX)
        trap 'rm -f "$snapshot"' EXIT
        {
          printf 'Tool,Version\n'
          {{range $name, $tool := .ACTIVE_TOOLS}}
          version_output=$({ {{$tool.version}}; } 2>/dev/null) || version_output=
          version_value=$(printf '%s\n' "${version_output:-∅}" | sed -nE '1{s/^[^0-9]*([0-9]+(\.[0-9]+)+[[:alnum:].+-]*).*/\1/;s/"/""/g;p;}')
          printf '"%s","%s"\n' "{{$name}}" "$version_value"
          {{end}}
        } > "$snapshot"
        mv "$snapshot" version.csv
        printf '已更新 version.csv\n'

  spell:
    desc: Check spelling in repository files
    preconditions:
      - sh: command -v typos >/dev/null 2>&1
        msg: Install typos with brew install typos-cli.
    cmds:
      - typos --format=brief --hidden

  start-bukuserver:
    desc: Start buku web server
    env:
      BUKUSERVER_THEME: united
      BUKUSERVER_DISABLE_FAVICON: "false"
      BUKUSERVER_OPEN_IN_NEW_TAB: "true"
    cmds:
      - bukuserver run --debug
